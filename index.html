<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>ICU文法ドリル</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--fg:#1d1f23;--mut:#5b6270;--line:#d9dde3;--acc:#1f5fbf;--acc-fg:#fff;--accbg:#e6efff;--ok:#137a3a;--okbg:#e3f5e9;--ng:#b42318;--ngbg:#fde8e6;--warn:#8a5a00;--warnbg:#fff3d6;--sel:#dce9ff;--shadow:0 1px 3px #0002;--uk:#c2410c;--ukbg:#fff0e6}
@media (prefers-color-scheme:dark){:root{--bg:#111316;--card:#1c1f24;--fg:#e8eaed;--mut:#a5acb8;--line:#343a43;--acc:#7fb0ff;--acc-fg:#0b1a33;--accbg:#1b2a44;--ok:#6fd896;--okbg:#14301f;--ng:#ff8a80;--ngbg:#3a1a18;--warn:#ffcf70;--warnbg:#3a2c0d;--sel:#24385a;--shadow:0 1px 3px #0008;--uk:#ffa86b;--ukbg:#3a2414}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:var(--bg);color:var(--fg);line-height:1.6;font-size:16px;padding:0 0 calc(40px + env(safe-area-inset-bottom))}
[lang|=zh]{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 12px}
header{background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header .wrap{display:flex;align-items:center;gap:8px;min-height:52px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap}
nav{display:flex;gap:4px}
nav button{min-height:44px;min-width:56px;padding:0 10px;border:0;background:none;color:var(--mut);font-size:15px;border-radius:8px}
nav button.on{color:var(--acc);font-weight:700;background:var(--accbg)}
@media (max-width:420px){nav{gap:2px}nav button{min-width:44px;padding:0 8px}}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.card{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:14px;margin:12px 0}
h2{font-size:18px;margin:4px 0 10px}
h3{font-size:16px;margin:14px 0 6px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:16px}
.btn.pri{background:var(--acc);color:var(--acc-fg);border-color:var(--acc);font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
.btn.full{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1 1 0;min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.seg button{min-height:44px;padding:0 12px;border-radius:22px;border:1px solid var(--line);background:var(--card);font-size:15px}
.seg button.on{background:var(--acc);color:var(--acc-fg);border-color:var(--acc);font-weight:700}
.lbl{font-size:13px;color:var(--mut);margin-top:6px}
.meta{font-size:13px;color:var(--mut);display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid var(--line);color:var(--mut);line-height:1.6}
.tag.off{border-color:var(--ok);color:var(--ok)}
.tag.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.ctx{color:var(--mut);font-size:15px;margin:0 0 6px}
.sent{font-size:17px;margin:0 0 8px}
.stem{font-weight:600;margin:6px 0}
.blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--acc);text-align:center;color:var(--acc);font-weight:700}
u.tg{text-decoration-thickness:2px;text-underline-offset:3px;font-weight:600}
.w{cursor:pointer;border-radius:3px}
.w.hl{background:var(--sel)}
.w.uk{color:var(--uk);text-decoration:underline wavy var(--uk);text-decoration-thickness:1.5px;text-underline-offset:3px}
.choices{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.ch{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--card);text-align:left;font-size:17px}
.ch .k{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg);font-weight:700;font-size:15px}
.ch.sel{border-color:var(--acc);background:var(--sel)}
.ch.ok{border-color:var(--ok);background:var(--okbg)}
.ch.ng{border-color:var(--ng);background:var(--ngbg)}
.ch[aria-disabled=true]{cursor:default}
.fb{border-radius:10px;padding:10px 12px;margin:8px 0}
.fb.ok{background:var(--okbg)}.fb.ng{background:var(--ngbg)}
.fb .res{font-weight:700;font-size:17px}
.fb.ok .res{color:var(--ok)}.fb.ng .res{color:var(--ng)}
.exp{margin:6px 0 4px;font-size:15px}
.prog{font-size:14px;color:var(--mut);display:flex;justify-content:space-between;align-items:center;min-height:44px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:4px}
.bar>i{display:block;height:100%;background:var(--acc)}
.list{list-style:none;padding:0;margin:0}
.list li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.grow{flex:1;min-width:0}
.yr{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.yr button{min-height:64px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:16px;font-weight:700;padding:6px}
.yr button small{display:block;font-weight:400;font-size:12px;color:var(--mut)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:13px}
td.n{text-align:right;white-space:nowrap}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.minibar{display:inline-block;width:60px;height:8px;background:var(--line);border-radius:4px;overflow:hidden;vertical-align:middle}
.minibar>i{display:block;height:100%;background:var(--ok)}
.passage p{font-size:17px;margin:0 0 12px}
.bl{display:inline-block;min-height:32px;min-width:44px;padding:0 6px;margin:2px 0;border-radius:6px;border:2px dashed var(--line);background:var(--card);font-size:15px;font-weight:700;color:var(--mut);vertical-align:baseline}
.bl.cur{border:2px solid var(--acc);color:var(--acc);background:var(--accbg)}
.bl.ok{border:2px solid var(--ok);color:var(--ok);background:var(--okbg)}
.bl.ng{border:2px solid var(--ng);color:var(--ng);background:var(--ngbg)}
.ybar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.ybar .wrap{display:flex;align-items:center;gap:8px;min-height:48px}
.ybar b{flex:1}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.qcard{border:2px solid var(--acc)}
#pop{position:absolute;z-index:30;display:none;pointer-events:none;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 18px #0004;padding:10px 12px;font-size:14px;line-height:1.5}
#pop .hw{font-weight:700;font-size:16px}
#pop .ps{color:var(--mut);font-size:12px;margin-left:6px}
#pop .ln{margin-top:4px}
#pop .ln b{display:inline-block;min-width:1.6em;color:var(--mut);font-weight:600}
#pop .ukb{pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:44px;margin-top:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--mut);font-size:15px;font-weight:600}
#pop .ukb.on{background:var(--ukbg);border-color:var(--uk);color:var(--uk)}
#pop .ukn{font-size:12px;color:var(--mut);margin-top:4px;text-align:center}
.wl li{align-items:flex-start}
.wl .hw{font-weight:700;font-size:17px}
.wl .ln{font-size:14px}
.wl .ln b{color:var(--mut);font-weight:600;margin-right:4px}
.cnt{display:inline-block;font-size:13px;font-weight:700;color:var(--uk);background:var(--ukbg);border-radius:10px;padding:0 8px;margin-left:4px}
.wl .refs{list-style:none;padding:0;margin:2px 0;font-size:13px;color:var(--mut)}
.wl .refs li{display:block;padding:0;border:0}
.link.qref{min-height:32px;padding:0;text-align:left;font-size:13px}
.wl .rm{min-height:40px;padding:0 12px;font-size:14px;flex:none}
.md h1{font-size:19px}.md h2{font-size:17px;margin-top:18px}
.md blockquote{margin:8px 0;padding:6px 10px;border-left:3px solid var(--line);color:var(--mut)}
.md code{background:var(--bg);padding:0 4px;border-radius:4px;font-size:.9em}
.md ul,.md ol{padding-left:1.4em}
.note{font-size:13px;color:var(--mut)}
.center{text-align:center}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;min-height:44px;font-size:14px}
#cpybox{display:none;position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));max-width:520px;margin:0 auto;z-index:40;background:var(--card);border-radius:12px;box-shadow:0 4px 18px #0005;padding:12px}
#cpybox textarea{width:100%;height:40vh;font-size:12px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;z-index:50;pointer-events:none}
label.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px}
label.chk input{width:22px;height:22px}
</style>
</head>
<body>
<header><div class="wrap"><h1>ICU文法ドリル</h1><nav><button data-go="home">ホーム</button><button data-go="words">単語</button><button data-go="stats">統計</button><button data-go="trend">傾向</button></nav></div></header>
<main id="app" class="wrap"><div class="card">読み込み中…</div></main>
<div id="pop" role="tooltip" aria-live="polite"></div>
<div id="cpybox"><div class="note" style="margin-bottom:6px">自動コピーできませんでした。全選択してコピーしてください</div><textarea id="cpyta" readonly></textarea><p class="center" style="margin:8px 0 0"><button class="btn" id="cpyx">閉じる</button></p></div>
<script>
'use strict';
// ---- 設定 ----
const KEY='icu_grammar_v1';
const DAY=864e5;
const CAT={'vocab':'語彙','collocation/preposition':'コロケーション・前置詞','usage/語法':'語法・品詞','conjunction/connector':'接続語','verb form':'動詞の形','referent':'指示語','discourse/cohesion':'文のつながり','relative clause':'関係詞','other':'その他'};
const catName=c=>CAT[c]||c;
let BANK=[],BY={},PAS={},GL={},TREND='';
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=(c,n)=>n?Math.round(c*100/n):0;
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const mmss=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// ---- 端末内の記録（localStorage のみ。送信なし） ----
// q: {id:{n:回答数,c:正解数,m:ミス数,s:連続正解,l:最終回答時刻,lw:最終ミス時刻,due:復習予定時刻}}
// runs: 年度別全文の記録 [{y,d,sc,t,sec}]  days: {日付:[回答数,正解数]}
let S;
function load(){try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){S={}}S.v=1;S.q=S.q||{};S.runs=S.runs||[];S.days=S.days||{}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function record(id,ok){
  const r=S.q[id]||(S.q[id]={n:0,c:0,m:0,s:0});const now=Date.now();
  r.n++;r.l=now;
  if(ok){r.c++;r.s++;if(r.m>0){const iv=[1,3,7,14,30][Math.min(r.s,4)];r.due=now+iv*DAY}}
  else{r.m++;r.s=0;r.lw=now;r.due=now+DAY}
  const d=today();const t=S.days[d]||(S.days[d]=[0,0]);t[0]++;if(ok)t[1]++;
  save();
}

// ---- わからない単語のチェック（別キー。上の学習記録 icu_grammar_v1 には触れない） ----
// U.w: {見出し語(glosses.json のキー):{zh,ja,pos, refs:[{q:問題ID|null, y:年|null, d:チェックした日}]}}
// 1つの問題につき1回までチェック（同じ問題でもう一度タップで解除）。チェック回数 = refs の数
const UKEY='icu_grammar_unknown_v1';
let U;
function uLoad(){try{U=JSON.parse(localStorage.getItem(UKEY))}catch(e){U=null}
  if(!U||typeof U!=='object'||Array.isArray(U))U={};U.v=1;if(!U.w||typeof U.w!=='object'||Array.isArray(U.w))U.w={};
  for(const k in U.w){const e=U.w[k];if(!e||!Array.isArray(e.refs)||!e.refs.length)delete U.w[k]}}
function uSave(){try{localStorage.setItem(UKEY,JSON.stringify(U))}catch(e){}}
function uToggle(k,g,ref){ // 戻り値: チェック後の状態
  let e=U.w[k];const i=e?e.refs.findIndex(r=>r.q===ref.q):-1;
  if(i>=0){e.refs.splice(i,1);if(!e.refs.length)delete U.w[k];uSave();return false}
  if(!e)e=U.w[k]={zh:g.zh||'',ja:g.ja||'',pos:g.pos||'',refs:[]};
  e.refs.push({q:ref.q,y:ref.y,d:today()});uSave();return true;
}
function uList(){return Object.entries(U.w).map(([k,e])=>({k,e,n:e.refs.length,last:e.refs.reduce((m,r)=>r.d>m?r.d:m,'')}))
  .sort((a,b)=>b.n-a.n||(a.last<b.last?1:a.last>b.last?-1:0)||a.k.localeCompare(b.k))}
const refLabel=r=>{const q=r.q&&BY[r.q];return q?srcLabel(q)+'（'+q.id+'）':(r.y?r.y+'年 ':'')+'（問題外）'};
function markAll(){document.querySelectorAll('.w').forEach(el=>{const h=lookup(el.textContent);el.classList.toggle('uk',!!(h&&U.w[h[0]]))})}

// ---- 単語の意味（glosses.json） ----
function lookup(w){
  let l=w.toLowerCase().replace(/[’‘]/g,"'");
  const cands=[l,l.replace(/'s$/,''),l.replace(/'$/,''),l.replace(/^'+|'+$/g,'')];
  for(const c of cands)if(GL[c])return[c,GL[c]];
  return null;
}
const WRE=/[A-Za-z][A-Za-z'’\-]*[A-Za-z]|[A-Za-z]/g;
const wspan=(h,m)=>'<span class="w'+(U&&U.w[h[0]]?' uk':'')+'">'+esc(m)+'</span>';
function wz(t){ // テキスト→単語ごとに span（辞書にある語のみタップ可能）
  let out='',i=0;t=String(t??'');
  t.replace(WRE,(m,off)=>{out+=esc(t.slice(i,off));
    let hit=lookup(m);
    if(!hit&&m.includes('-')){ // ハイフン語は辞書になければ分割
      out+=m.split(/(-)/).map(p=>{if(p==='-')return'-';const h=lookup(p);return h?wspan(h,p):esc(p)}).join('');
    }else out+=hit?wspan(hit,m):esc(m);
    i=off+m.length;return m});
  return out+esc(t.slice(i));
}
function rich(t){ // [[下線]] と ( ___ ) を処理
  return String(t??'').split(/(\[\[.*?\]\]|\(\s*_{2,}\s*\))/).map(p=>{
    if(/^\[\[/.test(p))return '<u class="tg">'+wz(p.slice(2,-2))+'</u>';
    if(/^\(\s*_/.test(p))return '<span class="blank">( &nbsp; )</span>';
    return wz(p)}).join('');
}
const pop=$('#pop');let popEl=null;
function showPop(el){
  const hit=lookup(el.textContent);if(!hit)return;
  const[k,g]=hit;
  if(popEl)popEl.classList.remove('hl');popEl=el;el.classList.add('hl');
  pop.innerHTML='<div><span class="hw">'+esc(k)+'</span><span class="ps">'+esc(g.pos||'')+(g.lemma?' ← '+esc(g.lemma):'')+'</span></div>'+
   '<div class="ln" lang="zh-Hans"><b>中</b>'+esc(g.zh)+'</div><div class="ln" lang="ja"><b>日</b>'+esc(g.ja)+'</div>';
  const ref=refOf(el),e=U.w[k],on=!!(e&&e.refs.some(r=>r.q===ref.q));
  pop.innerHTML+='<button type="button" class="ukb'+(on?' on':'')+'" aria-pressed="'+on+'">✓ わからない</button>'+
   (on?'<div class="ukn">この問題でチェック済み（もう一度タップで解除）<br>チェック計'+e.refs.length+'回</div>':e?'<div class="ukn">ほかの問題で'+e.refs.length+'回チェック済み</div>':'');
  pop.querySelector('.ukb').onclick=()=>{uToggle(k,g,ref);markAll();showPop(el)};
  pop.style.display='block';
  const vw=document.documentElement.clientWidth,w=Math.min(340,vw-24);pop.style.width=w+'px';
  const r=el.getBoundingClientRect();
  let left=r.left+window.scrollX+r.width/2-w/2;left=Math.max(12+window.scrollX,Math.min(left,window.scrollX+vw-w-12));
  pop.style.left=left+'px';
  const h=pop.offsetHeight;
  const below=r.bottom+8,above=r.top-8-h;
  const top=(below+h<window.innerHeight-8||above<8)?below:above;
  pop.style.top=(top+window.scrollY)+'px';
}
function refOf(el){ // 単語が出てきた問題（年度別全文の本文なら、いま解いている問題）
  const c=el.closest('[data-qid]')||(el.closest('.passage')&&app.querySelector('.qcard[data-qid]'));
  const q=c&&BY[c.dataset.qid];if(q)return{q:q.id,y:q.year};
  const p=el.closest('[data-yr]');return{q:null,y:p?+p.dataset.yr:null};
}
function hidePop(){pop.style.display='none';if(popEl){popEl.classList.remove('hl');popEl=null}}
document.addEventListener('click',e=>{
  if(e.target.closest('#pop'))return;
  const w=e.target.closest('.w');
  if(w)showPop(w);else hidePop();
},true);
window.addEventListener('resize',hidePop);

// ---- 表示ラベル ----
const srcLabel=q=>q.year+'年 Part '+q.part+' 第'+q.exam_q+'問';
function badges(q){
  let b=q.source==='key'?'<span class="tag off">公式解答</span>':'<span class="tag">自己解答</span>';
  if(q.confidence==='medium')b+='<span class="tag warn">答えに自信度低め</span>';
  return b;
}

// ---- 1問の表示 ----
// opts: {passage:段落テキスト(年度別Part I用), noText:true(年度別Part II: 本文側に表示), onAnswer(ok), next:{label,fn}}
function qCard(q,opts={}){
  const el=document.createElement('div');el.className='card'+(opts.cls?' '+opts.cls:'');el.dataset.qid=q.id;
  let h='<div class="meta"><span>'+esc(srcLabel(q))+'</span><span class="tag">'+esc(catName(q.category))+'</span></div>';
  if(opts.passage)h+='<p class="sent">'+rich(opts.passage)+'</p>';
  else if(opts.noText)h+='<p class="ctx">'+rich(q.sentence)+'</p>';
  else{
    if(q.context)h+='<p class="ctx">'+rich(q.context)+'</p>';
    h+='<p class="sent">'+rich(q.sentence)+'</p>';
  }
  if(q.stem)h+='<p class="stem">'+rich(q.stem)+'</p>';
  h+='<div class="choices">'+['a','b','c','d'].filter(k=>q.choices[k]!=null).map(k=>'<button class="ch" data-k="'+k+'"><span class="k">'+k+'</span><span class="grow">'+rich(q.choices[k])+'</span></button>').join('')+'</div>';
  h+='<div class="act"><button class="btn pri full" disabled>回答する</button><div class="note center" style="margin-top:4px">選択肢を選んで「回答する」（単語タップで意味・どこかをタップで閉じる）</div></div><div class="after"></div>';
  el.innerHTML=h;
  let sel=null,done=false;
  const go=el.querySelector('.act .btn');
  el.querySelectorAll('.ch').forEach(b=>b.addEventListener('click',()=>{
    if(done)return;sel=b.dataset.k;
    el.querySelectorAll('.ch').forEach(x=>x.classList.toggle('sel',x===b));go.disabled=false}));
  go.addEventListener('click',()=>{
    if(done||!sel)return;done=true;const ok=sel===q.answer;record(q.id,ok);
    el.querySelectorAll('.ch').forEach(x=>{x.setAttribute('aria-disabled','true');x.classList.remove('sel');
      if(x.dataset.k===q.answer)x.classList.add('ok');else if(x.dataset.k===sel)x.classList.add('ng')});
    el.querySelector('.act').remove();
    const a=el.querySelector('.after');

      '<div class="exp" lang="zh-Hans">'+wz(q.explanation_zh)+'</div><div class="meta" style="margin:4px 0 0">'+badges(q)+'</div></div>'+
      (opts.next?'<button class="btn pri full nx">'+esc(opts.next.label)+'</button>':'');
    if(opts.next)a.querySelector('.nx').addEventListener('click',opts.next.fn);

  });
  return el;
}

// ---- 出題の選び方（間違えた問題・苦手カテゴリを優先） ----
function catRates(){const m={};for(const q of BANK){const r=S.q[q.id];if(!r)continue;const t=m[q.category]||(m[q.category]={n:0,c:0});t.n+=r.n;t.c+=r.c}return m}
function pick(pool,count){
  const now=Date.now();
  const due=pool.filter(q=>{const r=S.q[q.id];return r&&r.m>0&&r.due&&r.due<=now})
    .sort((a,b)=>(S.q[b.id].m-S.q[a.id].m)||(S.q[a.id].due-S.q[b.id].due));
  const out=due.slice(0,Math.ceil(count*0.6));
  const used=new Set(out.map(q=>q.id));
  const cr=catRates();
  const rest=pool.filter(q=>!used.has(q.id)).map(q=>{
    const r=S.q[q.id],c=cr[q.category];
    const er=c&&c.n>=3?1-c.c/c.n:0.3;
    let w=1+3*er;
    if(!r)w*=1.5;
    else{if(now-r.l<12*36e5)w*=0.2;if(r.m>0&&r.due>now)w*=0.3;if(r.m===0&&r.c>=2)w*=0.5}
    return{q,k:Math.pow(Math.random(),1/w)}}).sort((a,b)=>b.k-a.k);
  for(const x of rest){if(out.length>=count)break;out.push(x.q)}
  return shuffle(out);
}
function weakList(){return BANK.filter(q=>S.q[q.id]&&S.q[q.id].m>0).sort((a,b)=>{const x=S.q[a.id],y=S.q[b.id];return(y.m-x.m)||((y.m/y.n)-(x.m/x.n))||(y.lw-x.lw)})}

function agg(keyFn){const m={};for(const q of BANK){const r=S.q[q.id];for(const k of [].concat(keyFn(q))){const t=m[k]||(m[k]={n:0,c:0,qs:0,tot:0});t.tot++;if(r){t.n+=r.n;t.c+=r.c;t.qs++}}}return m}
function statsData(){
  let n=0,c=0,u=0;for(const id in S.q){if(!BY[id])continue;n+=S.q[id].n;c+=S.q[id].c;u++}
  return{n,c,u,cat:agg(q=>q.category),tag:agg(q=>q.tags||[]),yr:agg(q=>q.year),part:agg(q=>'Part '+q.part),weak:weakList()};
}

      '<div class="ln" lang="zh-Hans"><b>中</b>'+esc(g.zh)+'</div><div class="ln" lang="ja"><b>日</b>'+esc(g.ja)+'</div>'+
      '<ul class="refs">'+e.refs.map(r=>'<li>出題: '+(r.q&&BY[r.q]?'<button class="link qref" data-id="'+esc(r.q)+'">'+esc(refLabel(r))+'</button>':esc(refLabel(r)))+'</li>').join('')+'</ul>'+
      '<div class="note">日付: '+esc(ds.join(', '))+'</div></span><button class="btn rm" data-k="'+esc(k)+'" aria-label="'+esc(k)+' を削除">削除</button></li>'}).join('')+'</ul>'+
      '<p class="center"><button class="link" id="wclr">すべて削除</button></p>'
    :'<p class="note">まだありません。問題の中で単語をタップして「✓ わからない」を押すと、ここに追加されます。</p>')+
   '<p class="note">この一覧は「記録をコピー」にも含まれます。端末（ブラウザ）内にだけ保存されます。</p></div>';
  app.querySelectorAll('.rm').forEach(b=>b.onclick=()=>{delete U.w[b.dataset.k];uSave();words();toast('削除しました')});
  app.querySelectorAll('.qref').forEach(b=>b.onclick=()=>route('quiz',{title:'1問練習',qs:[BY[b.dataset.id]]}));
  const c=$('#wclr');if(c)c.onclick=()=>{if(confirm('チェックした単語をすべて削除します。よろしいですか？（学習記録は消えません）')){U.w={};uSave();words()}};
}

// ---- 傾向（trend.md を表示） ----
function md(src){
  const inl=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  const lines=src.split('\n');let h='',i=0;
  while(i<lines.length){const l=lines[i];
    if(/^#{1,6} /.test(l)){const n=l.match(/^#+/)[0].length;h+='<h'+Math.min(n+1,4)+'>'+inl(l.replace(/^#+ /,''))+'</h'+Math.min(n+1,4)+'>';i++;continue}
    if(/^\|/.test(l)){const rows=[];while(i<lines.length&&/^\|/.test(lines[i]))rows.push(lines[i++]);
      const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      h+='<div class="tw"><table>'+rows.filter(r=>!/^\|[\s|:-]+\|$/.test(r)).map((r,k)=>'<tr>'+cells(r).map(c=>k?'<td>'+inl(c)+'</td>':'<th>'+inl(c)+'</th>').join('')+'</tr>').join('')+'</table></div>';continue}
    if(/^> ?/.test(l)){let b=[];while(i<lines.length&&/^> ?/.test(lines[i]))b.push(lines[i++].replace(/^> ?/,''));h+='<blockquote>'+b.map(inl).join('<br>')+'</blockquote>';continue}
    if(/^\s*([-*]|\d+\.) /.test(l)){ // 箇条書き（2段まで）
      const ord=/^\d+\./.test(l.trim());let items=[];
      while(i<lines.length&&/^\s*([-*]|\d+\.) /.test(lines[i])){const ln=lines[i++];const ind=ln.match(/^\s*/)[0].length;const t=ln.replace(/^\s*([-*]|\d+\.) /,'');
        if(ind>=2&&items.length)items[items.length-1].sub.push(t);else items.push({t,sub:[]})}
      h+=(ord?'<ol>':'<ul>')+items.map(x=>'<li>'+inl(x.t)+(x.sub.length?'<ul>'+x.sub.map(s=>'<li>'+inl(s)+'</li>').join('')+'</ul>':'')+'</li>').join('')+(ord?'</ol>':'</ul>');continue}
    if(!l.trim()){i++;continue}
    let p=[];while(i<lines.length&&lines[i].trim()&&!/^(#|\||>|\s*([-*]|\d+\.) )/.test(lines[i]))p.push(lines[i++]);h+='<p>'+p.map(inl).join('<br>')+'</p>';
  }
  return h;
}
function trend(){app.innerHTML='<div class="card md" lang="zh-Hans">'+md(TREND)+'</div>';}

load();uLoad();
Promise.all(['bank.json','passages.json','glosses.json'].map(f=>fetch('data/'+f).then(r=>{if(!r.ok)throw f;return r.json()})).concat(fetch('data/trend.md').then(r=>r.text())))
.then(([b,p,g,t])=>{BANK=b;BANK.forEach(q=>BY[q.id]=q);PAS=p;GL=g;TREND=t;const h=location.hash.slice(1);route(['stats','trend','words'].includes(h)?h:'home')})
.catch(e=>{app.innerHTML='<div class="card">データを読み込めませんでした（'+esc(e)+'）。再読み込みしてください。</div>'});
</script>
